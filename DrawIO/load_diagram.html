<!DOCTYPE html>
<html>
<head>
  <title>Draw.io Loader</title>
  <script src="https://app.diagrams.net/js/viewer.min.js"></script>
</head>
<body>
  <h3>Click the button to load your diagram</h3>
  <button onclick="loadDiagram()">Load Diagram</button>
  <div id="diagramContainer" style="width:100%; height:600px; border:1px solid #ccc;"></div>

  <script>
    function loadDiagram() {
      var xml = `<mxfile host="app.diagrams.net"><diagram name="Laptop to Circuit Playground Setup"><root><mxCell id="0"/><mxCell id="1" parent="0"/><mxCell id="laptop" value="School Laptop" style="shape=rectangle;fillColor=#D5E8D4;strokeColor=#82B366;fontSize=14;fontStyle=1;" vertex="1" parent="1"><mxGeometry x="50" y="50" width="120" height="60" as="geometry"/></mxCell><mxCell id="usb" value="USB Cable" style="shape=connector;endArrow=block;strokeColor=#6C8EBF;strokeWidth=2;" edge="1" parent="1" source="laptop" target="cpx"><mxGeometry relative="1" as="geometry"/></mxCell><mxCell id="cpx" value="Circuit Playground Express Kit" style="shape=rectangle;fillColor=#FFE6CC;strokeColor=#D79B00;fontSize=14;fontStyle=1;" vertex="1" parent="1"><mxGeometry x="250" y="50" width="180" height="60" as="geometry"/></mxCell><mxCell id="code" value="Upload code via MakeCode / CircuitPython" style="shape=rectangle;fillColor=#FFF2CC;strokeColor=#D6B656;fontSize=12;" vertex="1" parent="1"><mxGeometry x="250" y="130" width="180" height="40" as="geometry"/></mxCell><mxCell id="sensors" value="Use sensors & LEDs for interaction" style="shape=rectangle;fillColor=#F8CECC;strokeColor=#B85450;fontSize=12;" vertex="1" parent="1"><mxGeometry x="250" y="200" width="180" height="40" as="geometry"/></mxCell><mxCell id="arrow1" style="edgeStyle=orthogonalEdgeStyle;rounded=1;endArrow=block;strokeColor=#6C8EBF;" edge="1" parent="1" source="cpx" target="code"><mxGeometry relative="1" as="geometry"/></mxCell><mxCell id="arrow2" style="edgeStyle=orthogonalEdgeStyle;rounded=1;endArrow=block;strokeColor=#6C8EBF;" edge="1" parent="1" source="code" target="sensors"><mxGeometry relative="1" as="geometry"/></mxCell></root></diagram></mxfile>`;
      var container = document.getElementById('diagramContainer');
      var viewer = new GraphViewer(container, xml);
    }
  </script>
</body>
</html>
